name: Genesis checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all suites and the open corpus
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh --container-smoke
  full:
    if: github.event_name != 'workflow_dispatch' || inputs.full
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export submission source
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/genesis-submission"
          mkdir -p "$package"
          git archive --format=tar HEAD | tar -xf - -C "$package"
          git rev-parse HEAD > "$package/REVISION"
          test -s "$package/.dockerignore"
          test -s "$package/LICENSE"
      - name: Verify the exported submission
        working-directory: ${{ runner.temp }}/genesis-submission
        run: bash scripts/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-verification
          path: ${{ runner.temp }}/genesis-submission/artifacts/*.jsonl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-submission
          path: ${{ runner.temp }}/genesis-submission/
          include-hidden-files: true
          if-no-files-found: error
  isolation:
    if: github.event_name != 'workflow_dispatch' || inputs.full
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash sandbox/run_isolation_checks.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-isolation
          path: |
            artifacts/isolation/c18_*.json
            artifacts/isolation/probe.json
            artifacts/isolation/suites.txt
