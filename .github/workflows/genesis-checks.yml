name: Genesis checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete check after roles A and B are integrated
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target verify --tag genesis-g0 .
      - run: docker run --rm --network none genesis-g0 bash scripts/check.sh
  full:
    if: github.event_name == 'workflow_dispatch' && inputs.full
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: bash scripts/verify.sh
